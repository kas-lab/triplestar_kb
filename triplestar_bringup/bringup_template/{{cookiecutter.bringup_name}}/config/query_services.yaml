# Each entry creates a ROS service backed by a SPARQL query file from the
# queries/ directory.
#
# Reasoning is enabled per call via the CLI's -r/--reasoning flag rather
# than configured here.

query_services:
  count_triples:
    query_file: count_triples.sparql

  all_triples:
    query_file: get_all_triples.sparql

  time:
    query_file: get_time.sparql
