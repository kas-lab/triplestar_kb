[project]
site_name = "TriplestarKB"
site_description = "User and maintainer documentation for the TriplestarKB ROS 2 knowledge base"
site_author = "TriplestarKB contributors"
site_url = "https://kas-lab.github.io/triplestar_kb/"
repo_url = "https://github.com/kas-lab/triplestar_kb"
repo_name = "kas-lab/triplestar_kb"
edit_uri = "edit/main/docs/docs/"
copyright = "Copyright &copy; TriplestarKB contributors"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Using TriplestarKB" = [
    { "Querying" = "querying.md" },
    { "Visualization" = "visualization.md" },
  ] },
  { "Bringup packages" = [
    { "Overview" = "bringup/index.md" },
    { "Configuration" = "bringup/configuration.md" },
    { "Custom functions" = "bringup/custom-functions.md" },
  ] },
  { "Concepts" = [
    { "Architecture and lifecycle" = "concepts/architecture.md" },
    { "ROS to RDF conversions" = "concepts/message-conversions.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
